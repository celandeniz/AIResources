name: dynops-ai-platform

x-node-build: &node-build
  context: .
  dockerfile: infra/docker/node.Dockerfile

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dynops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dynops}
      POSTGRES_DB: ${POSTGRES_DB:-dynops}
    ports:
      - "${POSTGRES_HOST_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dynops}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage

  agent:
    build:
      context: ./services/agent
      dockerfile: Dockerfile
    environment:
      QDRANT_URL: http://qdrant:6333
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal-token}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-10-21}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      qdrant:
        condition: service_started

  api:
    build: *node-build
    image: dynops-node:local
    command: >
      sh -c "pnpm --filter @dynops/db push &&
             node packages/db/dist/seed.js &&
             node services/api/dist/main.js"
    environment:
      NODE_ENV: development
      API_PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-dynops}:${POSTGRES_PASSWORD:-dynops}@postgres:5432/${POSTGRES_DB:-dynops}?schema=public
      REDIS_URL: redis://redis:6379
      AGENT_URL: http://agent:8000
      AUTH_MODE: ${AUTH_MODE:-dev}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal-token}
      # Microsoft Graph (Outlook + Teams) app-only — empty => connectors stay mock/idle
      GRAPH_TENANT_ID: ${GRAPH_TENANT_ID:-}
      GRAPH_CLIENT_ID: ${GRAPH_CLIENT_ID:-}
      GRAPH_CLIENT_SECRET: ${GRAPH_CLIENT_SECRET:-}
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-60000}
      # Obsidian vault knowledge base (read-only mount). Set OBSIDIAN_VAULT_HOST_PATH
      # in .env to your vault folder; ENABLE_OBSIDIAN_SYNC drives the daily re-index.
      OBSIDIAN_VAULT_PATH: /vault
      ENABLE_OBSIDIAN_SYNC: ${ENABLE_OBSIDIAN_SYNC:-true}
      # Microsoft Teams bot (Phase 3). FAIL-CLOSED: with no TEAMS_BOT_SECRET set, the
      # /teams/* endpoints reject everything (bot disabled). No hardcoded default —
      # set a random TEAMS_BOT_SECRET in .env to enable the dev gate. Production:
      # set App ID/password and wire Bot Framework JWT validation (see infra/teams-bot-setup.md).
      TEAMS_BOT_APP_ID: ${TEAMS_BOT_APP_ID:-}
      TEAMS_BOT_APP_PASSWORD: ${TEAMS_BOT_APP_PASSWORD:-}
      TEAMS_BOT_SECRET: ${TEAMS_BOT_SECRET:-}
      # WhatsApp Cloud API (Meta). FAIL-CLOSED: webhook and outbound adapter are
      # disabled unless credentials are set. Set in .env to go live; empty = mock.
      # See infra/whatsapp-setup.md for the Meta app setup steps.
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      # Email watch / SLA escalation
      WATCH_OWNER_EMAIL: ${WATCH_OWNER_EMAIL:-deniz@dynamicsops.com}
      EMAIL_WATCH_ENABLED: ${EMAIL_WATCH_ENABLED:-true}
      EMAIL_WATCH_SLA_HOURS: ${EMAIL_WATCH_SLA_HOURS:-48}
      WATCH_TEAM_DOMAIN: ${WATCH_TEAM_DOMAIN:-dynamicsops.com}
      EMAIL_WATCH_TICK_MS: ${EMAIL_WATCH_TICK_MS:-1800000}
      # Azure Cosmos DB — Time Log / Work Reports (read-only key; empty = mock mode)
      COSMOS_ENDPOINT: ${COSMOS_ENDPOINT:-}
      COSMOS_READONLY_KEY: ${COSMOS_READONLY_KEY:-}
      COSMOS_KEY: ${COSMOS_KEY:-}
      COSMOS_CONNECTION_STRING: ${COSMOS_CONNECTION_STRING:-}
      COSMOS_DB: ${COSMOS_DB:-DynOpsCore}
    volumes:
      - ${OBSIDIAN_VAULT_HOST_PATH:-./infra/empty-vault}:/vault:ro
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: *node-build
    image: dynops-node:local
    command: ["node", "services/worker/dist/index.js"]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-dynops}:${POSTGRES_PASSWORD:-dynops}@postgres:5432/${POSTGRES_DB:-dynops}?schema=public
      REDIS_URL: redis://redis:6379
      AGENT_URL: http://agent:8000
      API_URL: http://api:4000
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal-token}
      ENABLE_DIGEST: "false"
      ENABLE_DAILY_BRIEF: "true"
      DAILY_BRIEF: "true"
      ENABLE_PROACTIVE: "true"
      PROACTIVE_TICK_MS: "300000"
      # Scheduled reply-style re-learn (re-harvest sent mail + re-distill profile)
      ENABLE_STYLE_RELEARN: ${ENABLE_STYLE_RELEARN:-true}
      STYLE_RELEARN_TICK_MS: ${STYLE_RELEARN_TICK_MS:-604800000}
      # Email watch / SLA escalation
      WATCH_OWNER_EMAIL: ${WATCH_OWNER_EMAIL:-deniz@dynamicsops.com}
      EMAIL_WATCH_ENABLED: ${EMAIL_WATCH_ENABLED:-true}
      EMAIL_WATCH_SLA_HOURS: ${EMAIL_WATCH_SLA_HOURS:-48}
      WATCH_TEAM_DOMAIN: ${WATCH_TEAM_DOMAIN:-dynamicsops.com}
    depends_on:
      api:
        condition: service_started
      agent:
        condition: service_started

  web:
    build: *node-build
    image: dynops-node:local
    command: ["pnpm", "--filter", "@dynops/web", "start"]
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:${API_HOST_PORT:-4000}
    ports:
      - "${WEB_HOST_PORT:-3001}:3000"
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
  qdrantdata:
